Status: Ready
Title: Chemical Checker Signaturizer 3D E1-5
Description: Places a compound within the clinical level of the Chemical Checker,
  five E spaces spanning therapeutic areas, indications, side effects, diseases and
  drug-drug interactions. These descriptors sit at the most integrated end of the
  resource, furthest from raw structure. They come from signaturizers retrained on
  three-dimensional representations after an analysis of over a million compounds
  found around 40% of stereoisomer pairs differing in bioactivity. Clinical signatures
  are extrapolated for unstudied compounds and carry correspondingly wide uncertainty.
